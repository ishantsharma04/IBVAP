<!DOCTYPE html><html><head><meta charset="UTF-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Add Vehicle — IBVAP</title><style>body{margin:0;background:#0b1220;color:#e8eef7;font-family:Arial}.wrap{max-width:700px;margin:40px auto;padding:20px}.card{background:#111b2e;border:1px solid #26344d;border-radius:12px;padding:24px}h1{margin-top:0}label{display:block;margin-top:14px;color:#aebbd0}input,select,textarea{box-sizing:border-box;width:100%;padding:11px;margin-top:6px;border-radius:7px;border:1px solid #34445f;background:#0b1425;color:#e8eef7}.btn{display:inline-block;padding:11px 16px;margin-top:18px;border:0;border-radius:7px;background:#1d4ed8;color:white;font-weight:bold;text-decoration:none;cursor:pointer}.back{background:#334155;margin-right:8px}.msg{margin-top:15px}</style></head><body><div class="wrap"><div class="card"><h1>＋ Add Vehicle</h1><p>Store vehicle information separately from person records.</p><form id="form"><label>Vehicle Name<input id="name" required placeholder="Demo Vehicle 02"></label><label>Category<select id="category"><option>VEHICLE_WATCHLIST</option><option>AUTHORIZED</option><option>UNKNOWN</option></select></label><label>Vehicle Plate<input id="plate" required placeholder="DEMO5678"></label><label>Status<select id="status"><option>ACTIVE</option><option>INACTIVE</option></select></label><label>Description<textarea id="description" rows="4" placeholder="Synthetic SIH demonstration vehicle"></textarea></label><a class="btn back" href="/">← DASHBOARD</a><button class="btn" type="submit">SAVE VEHICLE</button></form><div class="msg" id="msg"></div></div></div><script>document.getElementById('form').addEventListener('submit',async e=>{e.preventDefault();const r=await fetch('/entities',{method:'POST',headers:{'Content-Type':'application/json'},body:JSON.stringify({name:name.value,category:category.value,type:'VEHICLE',plate:plate.value,status:status.value,description:description.value})});const d=await r.json();if(d.ok)location.href='/';else msg.textContent='Error: '+d.error})</script></body></html>
